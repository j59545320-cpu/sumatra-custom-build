name: Build PdfiumPrint (Win32 x86)

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.cpp'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v4

      - name: 2. 下载开源预编译 PDFium (Win32 x86，兼容32/64位系统)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pdfium -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x86.tgz" -OutFile "pdfium.tgz"
          tar -xzf pdfium.tgz -C pdfium

      - name: 3. 初始化 MSVC x86 编译环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: 4. 静态编译 PdfiumPrint.exe (零 VC++ 运行库依赖)
        shell: cmd
        run: |
          mkdir output
          cl.exe /nologo /O2 /EHsc /MT /W3 /I pdfium\include main.cpp /link /LIBPATH:pdfium\lib pdfium.dll.lib winspool.lib gdi32.lib user32.lib /OUT:output\PdfiumPrint.exe
          copy /Y pdfium\bin\pdfium.dll output\pdfium.dll

      - name: 5. 打包上传成品
        uses: actions/upload-artifact@v4
        with:
          name: PdfiumPrint-Win32-Portable
          path: output/
