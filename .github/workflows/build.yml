name: Build Custom SumatraPDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 1. 拉取 SumatraPDF 源码与子模块
        run: |
          git config --global core.longpaths true
          git clone --recurse-submodules --depth 1 https://github.com/sumatrapdfreader/sumatrapdf.git .

      - name: 2. 注入 CJK 字体绝对路径优先拦截补丁
        shell: pwsh
        run: |
          $file = (Get-ChildItem -Path ext/mupdf -Recurse -Filter "pdf-font.c" | Select-Object -First 1).FullName
          Write-Host "锁定关键文件: $file" -ForegroundColor Green
          $c = [System.IO.File]::ReadAllText($file, [System.Text.Encoding]::UTF8)

          $helper = "#ifdef _WIN32`r`n#include <windows.h>`r`nstatic const char *_get_cjk_font(void) {`r`n    static char _b[512] = {0};`r`n    if (!_b[0]) {`r`n        if (GetModuleFileNameA(NULL, _b, 500)) {`r`n            char *_s = strrchr(_b, '\\');`r`n            if (_s) {`r`n                strcpy(_s + 1, `"AdobeSongStd-Light.otf`");`r`n                if (GetFileAttributesA(_b) != (DWORD)-1) return _b;`r`n                strcpy(_s + 1, `"SongStd-Light.otf`");`r`n                if (GetFileAttributesA(_b) != (DWORD)-1) return _b;`r`n            }`r`n        }`r`n        strcpy(_b, `"simsun.ttc`");`r`n    }`r`n    return _b;`r`n}`r`n#endif`r`n"

          $c = $helper + $c
          $c = $c.Replace('"simsun.ttc"', '_get_cjk_font()')

          $pattern = '(?s)(pdf_load_windows_font[^{]*\{[^}]*?char\s+path\[\d+\];)'
          $replacement = "`$1`r`n    if (fontname && fontname[1] == ':') return fz_new_font_from_file(ctx, name, fontname, index);"
          $c = [regex]::Replace($c, $pattern,$replacement, 1)

          [System.IO.File]::WriteAllText($file,$c, [System.Text.Encoding]::UTF8)
          Write-Host "绝对路径拦截补丁注入完成！" -ForegroundColor Green

      - name: 3. 配置编译环境 (MSBuild)
        uses: microsoft/setup-msbuild@v2

      - name: 4. 执行多线程编译 (Release x64)
        run: |
          if (Test-Path "vs2022/SumatraPDF.sln") {
              msbuild vs2022/SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          } elseif (Test-Path "src/SumatraPDF.sln") {
              msbuild src/SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          } else {
              $sln = Get-ChildItem -Filter *.sln -Recurse | Select-Object -First 1
              msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          }

      - name: 5. 提取并打包生成物
        shell: pwsh
        run: |
          Write-Host "正在扫描生成的 SumatraPDF.exe..." -ForegroundColor Cyan
          $exeList = Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse
          $exe =$exeList | Select-Object -First 1
          if ($exe) {
              Write-Host "成功锁定定制版程序: $($exe.FullName)" -ForegroundColor Green
              New-Item -ItemType Directory -Path ./output -Force
              Copy-Item -Path $exe.FullName -Destination ./output/SumatraPDF.exe
          } else {
              throw "编译未找到 SumatraPDF.exe 目标文件！"
          }

      - name: 6. 上传可执行文件到 GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-Custom-x64
          path: ./output/SumatraPDF.exe
