name: Build Custom SumatraPDF

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 1. 拉取源码
        run: |
          git config --global core.longpaths true
          git clone --recurse-submodules --depth 1 https://github.com/sumatrapdfreader/sumatrapdf.git .

      - name: 2. 注入同目录字体优先逻辑
        shell: pwsh
        run: |
          $file = (Get-ChildItem -Path ext/mupdf -Recurse -Filter "pdf-font.c" | Select-Object -First 1).FullName
          Write-Host "锁定源码文件: $file" -ForegroundColor Green

          $c = [System.IO.File]::ReadAllText($file, [System.Text.Encoding]::UTF8)

          # 寻找原版中加载 simsun.ttc 的经典保底调用
          # 原文通常形如: return pdf_load_windows_font(ctx, "simsun.ttc"); 或 fz_load_windows_font
          # 我们将其替换为：优先探测同目录 SongStd-Light.otf，若存在则用 fz_new_font_from_file 加载
          
          $targetPattern = '(?s)return\s+(?:pdf|fz)_load_windows_font\s*\(\s*ctx\s*,\s*"simsun\.ttc"\s*\)\s*;'
          
          # 纯 C 内联替换代码 (已提前解析 EXE 目录，无需外部声明新函数)
          $replaceCode = @'
{
    char _fp[512] = {0};
    if (GetModuleFileNameA(NULL, _fp, 500)) {
        char *_sep = strrchr(_fp, '\\');
        if (_sep) {
            *(_sep + 1) = '\0';
            strcat(_fp, "SongStd-Light.otf");
            if (GetFileAttributesA(_fp) != (DWORD)-1) {
                return fz_new_font_from_file(ctx, "SongStd-Light", _fp, 0);
            }
        }
    }
    return fz_load_windows_font(ctx, "simsun.ttc");
}
'@

          if ($c -match $targetPattern) {
              $c = [regex]::Replace($c, $targetPattern, $replaceCode, 1)
              Write-Host "成功将 simsun.ttc 回退点升级为本地 SongStd 探针！" -ForegroundColor Green
          } else {
              # 保底方案：如果是直接字符串引用
              $c = $c.Replace('"simsun.ttc"', '"SongStd-Light.otf"')
              Write-Host "已执行直接字库名称平替！" -ForegroundColor Yellow
          }

          [System.IO.File]::WriteAllText($file, $c, [System.Text.Encoding]::UTF8)

      - name: 3. 配置 MSBuild 环境
        uses: microsoft/setup-msbuild@v2

      - name: 4. 执行 Release x64 编译
        shell: cmd
        run: |
          msbuild vs2022\SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m

      - name: 5. 提取打包生成物
        shell: pwsh
        run: |
          $exePath = ""
          foreach ($f in (Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse)) {
              if ($f.FullName -match "Release") {
                  $exePath = $f.FullName
                  break
              }
          }
          if ($exePath -eq "") {
              foreach ($f in (Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse)) {
                  $exePath = $f.FullName
                  break
              }
          }
          Write-Host "找到最终生成物: $exePath" -ForegroundColor Green
          New-Item -ItemType Directory -Path ./output -Force
          Copy-Item -Path $exePath -Destination ./output/SumatraPDF.exe

      - name: 6. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-SongStd-x64
          path: ./output/SumatraPDF.exe
