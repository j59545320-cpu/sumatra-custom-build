name: Build Custom SumatraPDF

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 1. 拉取源码与子模块
        run: |
          git config --global core.longpaths true
          git clone --recurse-submodules --depth 1 https://github.com/sumatrapdfreader/sumatrapdf.git .

      - name: 2. 纯单行替换回退字体 (零多余语法)
        shell: pwsh
        run: |
          $fontFiles = Get-ChildItem -Path ext/mupdf -Recurse -Include "pdf-font.c","font-win32.c"
          
          foreach ($file in $fontFiles) {
              $content = [System.IO.File]::ReadAllText($file.FullName, [System.Text.Encoding]::UTF8)
              if ($content.Contains('"simsun.ttc"')) {
                  Write-Host "在 $($file.Name) 中发现 simsun.ttc，执行直接替换" -ForegroundColor Green
                  # 直接把所有回退字形指向 SongStd-Light.otf
                  $content = $content.Replace('"simsun.ttc"', '"SongStd-Light.otf"')
                  [System.IO.File]::WriteAllText($file.FullName, $content, [System.Text.Encoding]::UTF8)
              }
          }
          Write-Host "字体名称纯净替换完成！" -ForegroundColor Green

      - name: 3. 配置 MSBuild 环境
        uses: microsoft/setup-msbuild@v2

      - name: 4. 执行 Release x64 编译
        shell: cmd
        run: |
          msbuild vs2022\SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m

      - name: 5. 提取打包生成物
        shell: pwsh
        run: |
          $exePath = ""
          foreach ($f in (Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse)) {
              if ($f.FullName -match "Release") {
                  $exePath = $f.FullName
                  break
              }
          }
          if ($exePath -eq "") {
              foreach ($f in (Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse)) {
                  $exePath = $f.FullName
                  break
              }
          }
          Write-Host "找到最终生成物: $exePath" -ForegroundColor Green
          New-Item -ItemType Directory -Path ./output -Force
          Copy-Item -Path $exePath -Destination ./output/SumatraPDF.exe

      - name: 6. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-SongStd-x64
          path: ./output/SumatraPDF.exe
