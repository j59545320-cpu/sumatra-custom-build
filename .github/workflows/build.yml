name: Build Custom SumatraPDF

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 1. 拉取源码
        run: |
          git config --global core.longpaths true
          git clone --recurse-submodules --depth 1 https://github.com/sumatrapdfreader/sumatrapdf.git .

      - name: 2. 注入字体逻辑
        shell: pwsh
        run: |
          $file = (Get-ChildItem -Path ext/mupdf -Recurse -Filter "pdf-font.c" | Select-Object -First 1).FullName
          Write-Host "目标文件: $file" -ForegroundColor Green

          $c = [System.IO.File]::ReadAllText($file, [System.Text.Encoding]::UTF8)

          # 采用 Base64 彻底隔离所有特殊符号，杜绝 YAML 解析故障
          $b64 = ""
          $bytes = [System.Convert]::FromBase64String($b64)
          $patch = [System.Text.Encoding]::UTF8.GetString($bytes)

          $pattern = '(?s)return\s+(?:pdf|fz)_load_windows_font\s*\(\s*ctx\s*,\s*"simsun\.ttc"\s*\)\s*;'

          if ($c -match $pattern) {
              $c = [regex]::Replace($c, $pattern, $patch, 1)
              Write-Host "成功替换 simsun 调用点" -ForegroundColor Green
          } else {
              $c = $c.Replace('"simsun.ttc"', '"SongStd-Light.otf"')
              Write-Host "执行名称替换" -ForegroundColor Yellow
          }

          [System.IO.File]::WriteAllText($file, $c, [System.Text.Encoding]::UTF8)

      - name: 3. 配置 MSBuild 环境
        uses: microsoft/setup-msbuild@v2

      - name: 4. 执行 Release x64 编译
        shell: cmd
        run: |
          msbuild vs2022\SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m

      - name: 5. 提取打包生成物
        shell: pwsh
        run: |
          $exePath = ""
          foreach ($f in (Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse)) {
              if ($f.FullName -match "Release") {
                  $exePath = $f.FullName
                  break
              }
          }
          if ($exePath -eq "") {
              foreach ($f in (Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse)) {
                  $exePath = $f.FullName
                  break
              }
          }
          Write-Host "找到最终生成物: $exePath" -ForegroundColor Green
          New-Item -ItemType Directory -Path ./output -Force
          Copy-Item -Path $exePath -Destination ./output/SumatraPDF.exe

      - name: 6. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-SongStd-x64
          path: ./output/SumatraPDF.exe
