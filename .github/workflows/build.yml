name: Build Custom SumatraPDF

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 1. 拉取源码与子模块
        run: |
          git config --global core.longpaths true
          git clone --recurse-submodules --depth 1 https://github.com/sumatrapdfreader/sumatrapdf.git .

      - name: 2. 注入字体拦截补丁
        shell: pwsh
        run: |
          # 寻找核心源码
          $target = Get-ChildItem -Path ext/mupdf -Recurse -Filter "pdf-font.c" | Select-Object -First 1
          if (-not $target) {
              $target = Get-ChildItem -Path ext/mupdf -Recurse -Filter "font-win32.c" | Select-Object -First 1
          }
          Write-Host "命中目标文件: $($target.FullName)" -ForegroundColor Green

          $c = [System.IO.File]::ReadAllText($target.FullName, [System.Text.Encoding]::UTF8)

          # 准备注入函数 (通过 Base64 规避所有 YAML 引号和转义陷阱)
          $b64 = ""
          $bytes = [System.Convert]::FromBase64String($b64)
          $funcCode = [System.Text.Encoding]::UTF8.GetString($bytes)

          # 插入到文件开头
          $c = $funcCode + "`r`n" + $c

          # 在 CJK 字体加载入口前置拦截
          $hookRegex = '(?s)(fz_font\s*\*\s*(?:fz_load_system_cjk_font|pdf_load_windows_cjk_font|pdf_load_windows_font)\s*\([^)]*\)\s*\{)'
          $hookBody = "`$1`r`n#ifdef _WIN32`r`n    { fz_font *_f = _load_local_songstd(ctx); if (_f) return _f; }`r`n#endif`r`n"

          $c = [regex]::Replace($c, $hookRegex,$hookBody, 1)
          [System.IO.File]::WriteAllText($target.FullName, $c, [System.Text.Encoding]::UTF8)
          Write-Host "补丁安全写入完成！" -ForegroundColor Green

      - name: 3. 配置 MSBuild 环境
        uses: microsoft/setup-msbuild@v2

      - name: 4. 执行 Release x64 编译
        shell: pwsh
        run: |
          # 准确锁定 SumatraPDF 主工程（规避第三方子模块中的 .sln）
          $mainSln = @( "vs2022/SumatraPDF.sln", "src/SumatraPDF.sln", "SumatraPDF.sln" ) \vert{} Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $mainSln) {$mainSln = (Get-ChildItem -Path . -Filter "SumatraPDF.sln" -Recurse | Select-Object -First 1).FullName
          }

          Write-Host "锁定主工程文件: $mainSln" -ForegroundColor Green
          msbuild $mainSln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m

      - name: 5. 提取打包生成物
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse \vert{} Where-Object { $_.FullName -match "Release" } | Select-Object -First 1).FullName
          if (-not $exe) {$exe = (Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse | Select-Object -First 1).FullName
          }
          Write-Host "找到最终生成物: $exe" -ForegroundColor Green
          New-Item -ItemType Directory -Path ./output -Force
          Copy-Item -Path $exe -Destination ./output/SumatraPDF.exe

      - name: 6. 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-SongStd-x64
          path: ./output/SumatraPDF.exe
