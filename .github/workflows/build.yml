name: Build Custom SumatraPDF

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 1. 拉取源码
        run: |
          git config --global core.longpaths true
          git clone --recurse-submodules --depth 1 https://github.com/sumatrapdfreader/sumatrapdf.git .

      - name: 2. 精准注入无损字体分流逻辑
        shell: pwsh
        run: |
          $targetFiles = Get-ChildItem -Path "ext/mupdf/source" -Recurse -Filter "*.c";
          $patchedCount = 0;

          $b64Hook = "";
          $hookCode = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($b64Hook)).Replace("GetModuleFileNamea", "GetModuleFileNameA");

          foreach ($f in $targetFiles) {
              $txt = [System.IO.File]::ReadAllText($f.FullName, [System.Text.Encoding]::UTF8);
              $modified = $false;

              if ($txt -match '(?i)"simsun\.ttc"') {
                  Write-Host "在 $($f.Name) 中定位到 simsun.ttc，执行替换..." -ForegroundColor Cyan;
                  $txt = $txt -replace '(?i)"simsun\.ttc"', '"SongStd-Light.otf"';
                  $modified = $true;
                  $patchedCount++;
              }

              if ($f.Name -eq "font.c" -and $txt -match 'fz_new_font_from_file\s*\([^)]+\)\s*\{') {
                  Write-Host "在 font.c 注入本地同级目录智能兜底..." -ForegroundColor Green;
                  $txt = [regex]::Replace($txt, '(?s)(fz_new_font_from_file\s*\([^)]+\)\s*\{)', "`$1`r`n$hookCode", 1);
                  $modified =$true;
                  $patchedCount++;
              }

              if ($modified) {
                  [System.IO.File]::WriteAllText($f.FullName, $txt, [System.Text.Encoding]::UTF8);
              }
          }

          if ($patchedCount -eq 0) {
              Write-Error "未命中目标代码，停止编译！";
              exit 1;
          }

      - name: 3. 配置 MSBuild 环境
        uses: microsoft/setup-msbuild@v2

      - name: 4. 执行 Release x64 编译
        shell: cmd
        run: |
          msbuild vs2022\SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m

      - name: 5. 提取打包生成物
        shell: pwsh
        run: |
          $exePath = (Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse \vert{} Where-Object { $_.FullName -match "Release" } | Select-Object -First 1).FullName;
          New-Item -ItemType Directory -Path ./output -Force;
          Copy-Item -Path $exePath -Destination ./output/SumatraPDF.exe;

      - name: 6. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-SongStd-x64
          path: ./output/SumatraPDF.exe
