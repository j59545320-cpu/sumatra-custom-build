name: Build Custom SumatraPDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 1. 拉取 SumatraPDF 源码与子模块
        run: |
          git config --global core.longpaths true
          git clone --recurse-submodules --depth 1 https://github.com/sumatrapdfreader/sumatrapdf.git .

      - name: 2. 注入 CJK 字体绝对路径补丁 (基于已证实的 simsun 靶点)
        shell: pwsh
        run: |
          Write-Host "正在检索包含 simsun 的源码文件..." -ForegroundColor Cyan
          $targetFiles = Get-ChildItem -Path ext/mupdf -Recurse -Include *.c,*.cpp,*.h | Where-Object { 
              (Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue) -match '"simsun\.ttc"' 
          }

          if (-not $targetFiles) {
              throw "未找到包含 simsun.ttc 的文件！"
          }

          # 构造纯 C 语言静态内联辅助函数：直接抓取 EXE 所在目录并拼接字体绝对路径
          $helperCode = @(
              '#ifdef _WIN32',
              '#include <windows.h>',
              'static const char* _get_custom_cjk_font(void) {',
              '    static char _buf[512] = {0};',
              '    if (_buf[0] == 0) {',
              '        char _dir[512] = {0};',
              '        if (GetModuleFileNameA(NULL, _dir, 500)) {',
              '            char *_p = strrchr(_dir, ''\\'');',
              '            if (_p) {',
              '                strcpy(_p + 1, "AdobeSongStd-Light.otf");',
              '                if (GetFileAttributesA(_dir) != (DWORD)-1) { strcpy(_buf, _dir); return _buf; }',
              '                strcpy(_p + 1, "SongStd-Light.otf");',
              '                if (GetFileAttributesA(_dir) != (DWORD)-1) { strcpy(_buf, _dir); return _buf; }',
              '            }',
              '        }',
              '        strcpy(_buf, "simsun.ttc");',
              '    }',
              '    return _buf;',
              '}',
              '#else',
              '#define _get_custom_cjk_font() "simsun.ttc"',
              '#endif',
              ''
          ) -join "`r`n"

          foreach ($file in$targetFiles) {
              Write-Host "正在注入绝对路径补丁: $($file.FullName)" -ForegroundColor Green
              $content = [System.IO.File]::ReadAllText($file.FullName, [System.Text.Encoding]::UTF8)
              
              # 1. 在文件最顶部插入获取 EXE 绝对路径的内联函数
              # 2. 将代码中所有的 "simsun.ttc" 替换为该函数调用 _get_custom_cjk_font()
              $patched = $helperCode + ($content -replace '"simsun\.ttc"', '_get_custom_cjk_font()')
              
              [System.IO.File]::WriteAllText($file.FullName, $patched, [System.Text.Encoding]::UTF8)
          }

          # 同时检查 MuPDF 拼接 Windows Fonts 目录的地方，防止绝对路径被二次冠以 C:\Windows\Fonts\
          $winFontFiles = Get-ChildItem -Path ext/mupdf,src -Recurse -Include *.c,*.cpp | Where-Object {
              (Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue) -match '\\Fonts\\'
          }
          foreach ($wf in$winFontFiles) {
              Write-Host "发现系统字体目录拼接点: $($wf.FullName)" -ForegroundColor Cyan
          }

          Write-Host "所有补丁注入完毕！" -ForegroundColor Green

      - name: 3. 配置编译环境 (MSBuild)
        uses: microsoft/setup-msbuild@v2

      - name: 4. 执行多线程编译 (Release x64)
        run: |
          if (Test-Path "vs2022/SumatraPDF.sln") {
              msbuild vs2022/SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          } elseif (Test-Path "src/SumatraPDF.sln") {
              msbuild src/SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          } else {
              $sln = Get-ChildItem -Filter *.sln -Recurse | Select-Object -First 1
              msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          }

      - name: 5. 提取并打包生成物
        shell: pwsh
        run: |
          Write-Host "正在全盘扫描生成的 SumatraPDF.exe..." -ForegroundColor Cyan
          $exeList = Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse
          $exe =$exeList | Select-Object -First 1
          if ($exe) {
              Write-Host "成功锁定定制版程序: $($exe.FullName)" -ForegroundColor Green
              New-Item -ItemType Directory -Path ./output -Force
              Copy-Item -Path $exe.FullName -Destination ./output/SumatraPDF.exe
          } else {
              throw "编译未找到 SumatraPDF.exe 目标文件！"
          }

      - name: 6. 上传可执行文件到 GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-Custom-x64
          path: ./output/SumatraPDF.exe
