name: Build Custom SumatraPDF

on:
  workflow_dispatch: # 支持网页端一键手动触发

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 1. 拉取 SumatraPDF 源码与子模块
        run: |
          git config --global core.longpaths true
          git clone --recurse-submodules --depth 1 https://github.com/sumatrapdfreader/sumatrapdf.git .

      - name: 2. 注入 CJK 字体绝对路径优先拦截补丁
        shell: pwsh
        run: |
          Write-Host "正在定位 pdf-font.c ..." -ForegroundColor Cyan
          $target = Get-ChildItem -Path ext/mupdf -Recurse -Filter "pdf-font.c" | Select-Object -First 1
          if (-not $target) { throw "未找到 pdf-font.c！" }
          Write-Host "锁定关键文件: $($target.FullName)" -ForegroundColor Green

          $content = [System.IO.File]::ReadAllText($target.FullName, [System.Text.Encoding]::UTF8)

          $injectCode = @'
    /* --- CUSTOM FONT INJECTION START --- */
    if (name && (strstr(name, "simsun") || strstr(name, "Song") || strstr(name, "song"))) {
        char _custom_p[MAX_PATH];
        if (GetModuleFileNameA(NULL, _custom_p, MAX_PATH)) {
            char *_slash = strrchr(_custom_p, '\\');
            if (_slash) {
                strcpy(_slash + 1, "AdobeSongStd-Light.otf");
                if (GetFileAttributesA(_custom_p) != (DWORD)-1) {
                    fz_font *_cf = fz_new_font_from_file(ctx, name, _custom_p, 0);
                    if (_cf) return _cf;
                }
                strcpy(_slash + 1, "SongStd-Light.otf");
                if (GetFileAttributesA(_custom_p) != (DWORD)-1) {
                    fz_font *_cf = fz_new_font_from_file(ctx, name, _custom_p, 0);
                    if (_cf) return _cf;
                }
            }
        }
    }
    /* --- CUSTOM FONT INJECTION END --- */
'@

          $regex = [regex]'GetSystemWindowsDirectory'
          if ($regex.IsMatch($content)) {
              $patched =$regex.Replace($content, ($injectCode + "`r`n    GetSystemWindowsDirectory"), 1)
              [System.IO.File]::WriteAllText($target.FullName, $patched, [System.Text.Encoding]::UTF8)
              Write-Host "底层硬拦截补丁注入成功！" -ForegroundColor Green
          } else {
              throw "未在 pdf-font.c 中找到 GetSystemWindowsDirectory 关键字！"
          }

      - name: 3. 配置编译环境 (MSBuild)
        uses: microsoft/setup-msbuild@v2

      - name: 4. 执行多线程编译 (Release x64)
        run: |
          if (Test-Path "vs2022/SumatraPDF.sln") {
              msbuild vs2022/SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          } elseif (Test-Path "src/SumatraPDF.sln") {
              msbuild src/SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          } else {
              $sln = Get-ChildItem -Filter *.sln -Recurse | Select-Object -First 1
              msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          }

      - name: 5. 提取并打包生成物
        shell: pwsh
        run: |
          Write-Host "正在扫描生成的 SumatraPDF.exe..." -ForegroundColor Cyan
          $exeList = Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse
          $exe =$exeList | Select-Object -First 1
          if ($exe) {
              Write-Host "成功锁定定制版程序: $($exe.FullName)" -ForegroundColor Green
              New-Item -ItemType Directory -Path ./output -Force
              Copy-Item -Path $exe.FullName -Destination ./output/SumatraPDF.exe
          } else {
              throw "编译未找到 SumatraPDF.exe 目标文件！"
          }

      - name: 6. 上传可执行文件到 GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-Custom-x64
          path: ./output/SumatraPDF.exe
