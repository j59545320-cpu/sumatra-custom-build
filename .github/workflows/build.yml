name: Build Custom SumatraPDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 1. 拉取 SumatraPDF 源码与子模块
        run: |
          git config --global core.longpaths true
          git clone --recurse-submodules --depth 1 https://github.com/sumatrapdfreader/sumatrapdf.git .

      - name: 2. 注入 CJK 字体绝对路径优先拦截补丁
        shell: pwsh
        run: |
          Write-Host "正在检索 CJK 字体加载文件..." -ForegroundColor Cyan
          $targetFiles = Get-ChildItem -Path ext/mupdf -Recurse -Include *.c | Where-Object { 
              (Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue) -match 'simsun\.ttc' 
          }

          if (-not $targetFiles) {
              throw "未找到包含 simsun.ttc 的文件！"
          }

          $targetFiles | ForEach-Object {
              $filePath =$_.FullName
              Write-Host "正在处理目标文件: $filePath" -ForegroundColor Green
              $content = [System.IO.File]::ReadAllText($filePath, [System.Text.Encoding]::UTF8)

              # 注入逻辑：在每次匹配 simsun 时，优先探测当前 EXE 目录下的 OTF 绝对路径
              $hookCode = @'
(GetFileAttributesA(([]() -> const char* {
    static char _p[512] = {0};
    if (!_p[0]) {
        if (GetModuleFileNameA(NULL, _p, 500)) {
            char *_s = strrchr(_p, '\\');
            if (_s) {
                strcpy(_s + 1, "AdobeSongStd-Light.otf");
                if (GetFileAttributesA(_p) != (DWORD)-1) return _p;
                strcpy(_s + 1, "SongStd-Light.otf");
                if (GetFileAttributesA(_p) != (DWORD)-1) return _p;
            }
        }
        strcpy(_p, "simsun.ttc");
    }
    return _p;
})()) != (DWORD)-1 ? _p : "simsun.ttc")
'@

              # 兼容纯 C 文件的安全替换方式：通过替换字符串直接替换为绝对路径探测
              # 为避免 C 语法冲突，直接将文件名参数动态化
              $replacement = '((GetModuleFileNameA(NULL, _font_buf, 500), (strrchr(_font_buf, ''\\'') ? (strcpy(strrchr(_font_buf, ''\\'') + 1, "AdobeSongStd-Light.otf"), (GetFileAttributesA(_font_buf) != (DWORD)-1 ? _font_buf : "simsun.ttc")) : "simsun.ttc")))'

              # 直接将包含 simsun.ttc 的调用点做绝对路径劫持
              $patched =$content -replace '"simsun\.ttc"', '(_get_cjk_font_path())'
              
              $funcDef = @(
                  '#ifdef _WIN32',
                  '#include <windows.h>',
                  'static const char* _get_cjk_font_path(void) {',
                  '    static char _b[512] = {0};',
                  '    if (_b[0] == 0) {',
                  '        if (GetModuleFileNameA(NULL, _b, 500)) {',
                  '            char *_sep = strrchr(_b, ''\\'');',
                  '            if (_sep) {',
                  '                strcpy(_sep + 1, "AdobeSongStd-Light.otf");',
                  '                if (GetFileAttributesA(_b) != (DWORD)-1) return _b;',
                  '                strcpy(_sep + 1, "SongStd-Light.otf");',
                  '                if (GetFileAttributesA(_b) != (DWORD)-1) return _b;',
                  '            }',
                  '        }',
                  '        strcpy(_b, "simsun.ttc");',
                  '    }',
                  '    return _b;',
                  '}',
                  '#endif',
                  ''
              ) -join "`r`n"

              [System.IO.File]::WriteAllText($filePath, ($funcDef +$patched), [System.Text.Encoding]::UTF8)
          }

          Write-Host "补丁注入完成！" -ForegroundColor Green

      - name: 3. 配置编译环境 (MSBuild)
        uses: microsoft/setup-msbuild@v2

      - name: 4. 执行多线程编译 (Release x64)
        run: |
          if (Test-Path "vs2022/SumatraPDF.sln") {
              msbuild vs2022/SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          } elseif (Test-Path "src/SumatraPDF.sln") {
              msbuild src/SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          } else {
              $sln = Get-ChildItem -Filter *.sln -Recurse | Select-Object -First 1
              msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m
          }

      - name: 5. 提取并打包生成物
        shell: pwsh
        run: |
          Write-Host "正在扫描生成的 SumatraPDF.exe..." -ForegroundColor Cyan
          $exeList = Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse
          $exe =$exeList | Select-Object -First 1
          if ($exe) {
              Write-Host "成功锁定定制版程序: $($exe.FullName)" -ForegroundColor Green
              New-Item -ItemType Directory -Path ./output -Force
              Copy-Item -Path $exe.FullName -Destination ./output/SumatraPDF.exe
          } else {
              throw "编译未找到 SumatraPDF.exe 目标文件！"
          }

      - name: 6. 上传可执行文件到 GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-Custom-x64
          path: ./output/SumatraPDF.exe
