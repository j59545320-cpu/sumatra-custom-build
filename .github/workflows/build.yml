name: Build Custom SumatraPDF

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 1. 拉取源码与子模块
        run: |
          git config --global core.longpaths true
          git clone --recurse-submodules --depth 1 https://github.com/sumatrapdfreader/sumatrapdf.git .

      - name: 2. 注入字体拦截补丁 (防转义版)
        shell: pwsh
        run: |
          $target = ""
          foreach ($f in (Get-ChildItem -Path ext/mupdf -Recurse -Filter "pdf-font.c")) {
              $target = $f.FullName
              break
          }
          if ($target -eq "") {
              foreach ($f in (Get-ChildItem -Path ext/mupdf -Recurse -Filter "font-win32.c")) {
                  $target = $f.FullName
                  break
              }
          }
          Write-Host "锁定目标文件: $target" -ForegroundColor Green

          $c = [System.IO.File]::ReadAllText($target, [System.Text.Encoding]::UTF8)

          $b64 = ""
          $bytes = [System.Convert]::FromBase64String($b64)
          $funcCode = [System.Text.Encoding]::UTF8.GetString($bytes)

          $c = $funcCode + "`r`n" + $c
          $hookRegex = '(?s)(fz_font\s*\*\s*(?:fz_load_system_cjk_font|pdf_load_windows_cjk_font|pdf_load_windows_font)\s*\([^)]*\)\s*\{)'
          $hookBody = "`$1`r`n#ifdef _WIN32`r`n    { fz_font *_f = _load_local_songstd(ctx); if (_f) return _f; }`r`n#endif`r`n"

          $c = [regex]::Replace($c, $hookRegex,$hookBody, 1)
          [System.IO.File]::WriteAllText($target,$c, [System.Text.Encoding]::UTF8)
          Write-Host "补丁写入成功！" -ForegroundColor Green

      - name: 3. 配置 MSBuild 环境
        uses: microsoft/setup-msbuild@v2

      - name: 4. 执行 Release x64 编译 (纯 cmd 绝对路径)
        shell: cmd
        run: |
          msbuild vs2022\SumatraPDF.sln /p:Configuration=Release /p:Platform=x64 /t:SumatraPDF /m

      - name: 5. 提取打包生成物 (防转义版)
        shell: pwsh
        run: |
          $exePath = ""
          foreach ($f in (Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse)) {
              if ($f.FullName -match "Release") {
                  $exePath =$f.FullName
                  break
              }
          }
          if ($exePath -eq "") {
              foreach ($f in (Get-ChildItem -Path . -Filter "SumatraPDF.exe" -Recurse)) {
                  $exePath =$f.FullName
                  break
              }
          }
          Write-Host "找到最终生成物: $exePath" -ForegroundColor Green
          New-Item -ItemType Directory -Path ./output -Force
          Copy-Item -Path $exePath -Destination ./output/SumatraPDF.exe

      - name: 6. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-SongStd-x64
          path: ./output/SumatraPDF.exe
